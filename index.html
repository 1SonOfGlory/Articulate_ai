<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Articulate AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --apple-ease: cubic-bezier(0.25, 1, 0.5, 1);
            --fluid-ease: cubic-bezier(0.16, 1, 0.3, 1);
            --liquid-ease: cubic-bezier(0.68, -0.6, 0.32, 1.6); /* More elastic liquid feel */
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #1d1d1f;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        
        .glass-morphism {
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }
        
        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.015); }
        }
        
        @keyframes slide-up {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes cursor-blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        @keyframes type-here-fade {
            0%, 100% { opacity: 0.3; transform: translateX(0); }
            50% { opacity: 0.6; transform: translateX(4px); }
        }

        .animate-breathe {
            animation: breathe 3s var(--apple-ease) infinite;
        }

        .stagger-in {
            opacity: 0;
            animation: slide-up 1s var(--apple-ease) forwards;
        }

        /* Fluid Shifting Pill - Liquified Shifting */
        .fluid-pill {
            transition: left 0.8s var(--fluid-ease), 
                        width 0.6s var(--fluid-ease), 
                        background-color 1s var(--apple-ease),
                        box-shadow 0.8s var(--apple-ease),
                        transform 0.5s var(--liquid-ease);
        }

        /* Premium Input Styles */
        .premium-input-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .custom-cursor-element {
            width: 2.5px;
            height: 1.1em;
            background-color: #000;
            margin-left: 4px;
            animation: cursor-blink 1s step-end infinite;
            display: inline-block;
            vertical-align: middle;
        }

        .scrolling-placeholder::placeholder {
            animation: type-here-fade 3s ease-in-out infinite;
            font-weight: 300;
            letter-spacing: -0.02em;
        }

        input::placeholder {
            color: #e5e7eb;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 3px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 10px;
        }

        ::selection {
            background: #000;
            color: #fff;
        }

        /* Section focus ring - subtle */
        .section-focus {
            outline: none;
            transition: box-shadow 0.6s var(--apple-ease);
        }
        .section-focus:focus-within {
            box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.02);
        }
    </style>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
